name: Publish Docker Images (GHCR)

on:
  push:
    branches:
      - master
    paths:
      - "docker/**"
      - "src/**"
      - "pgxcrown.nimble"
      - ".github/workflows/docker-ghcr.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pgxcrown_source:
        description: "Package source inside image ('local' from checkout or 'nimble' from registry)"
        required: false
        default: "local"
        type: choice
        options:
          - local
          - nimble

permissions:
  contents: read
  packages: write

jobs:
  publish-pgxcrown-images:
    name: Build & Push pgxcrown:${{ matrix.pg_version }} (GHCR)
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-pg-${{ matrix.pg_version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["14", "15", "16", "17", "18"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute GHCR tags & metadata
        id: meta
        shell: bash
        run: |
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO="ghcr.io/${OWNER_LOWER}/pgxcrown"
          PG_VER="${{ matrix.pg_version }}"
          PKG_VER="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pgxcrown.nimble | head -n1)"

          TAGS="${REPO}:${PG_VER}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${REPO}:${PG_VER}-${TAG_VER}"
          elif [ -n "${PKG_VER}" ]; then
            TAGS="${TAGS},${REPO}:${PG_VER}-${PKG_VER}"
          fi

          if [ "${PG_VER}" = "18" ]; then
            TAGS="${TAGS},${REPO}:latest"
          fi

          echo "repo=${REPO}" >> "${GITHUB_OUTPUT}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pgxcrown:${{ matrix.pg_version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PG_TAG=${{ matrix.pg_version }}
            NIM_VERSION=2.4.0
            PGXCROWN_SOURCE=${{ inputs.pgxcrown_source || 'local' }}
          cache-from: type=gha,scope=pgxcrown-pg-${{ matrix.pg_version }}
          cache-to: type=gha,mode=max,scope=pgxcrown-pg-${{ matrix.pg_version }}
