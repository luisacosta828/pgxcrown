name: Build
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        nim-channel: [stable]
    name: ${{ matrix.platform }}-nim-${{ matrix.nim-channel }}
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ matrix.nim-channel }}

    - name: Linux Dev dependencies setup      
      run: |
        sudo apt -y update
        sudo apt -y install build-essential postgresql postgresql-contrib libpq-dev postgresql-server-dev-16 || sudo apt -y install build-essential postgresql postgresql-contrib libpq-dev postgresql-server-dev-all

    - name: Nimble setup
      run: |
        nimble -y refresh
        nimble -y install

    - name: Run Unit Tests
      run: |
        nim c -r --hints:off tests/test_base_types.nim

    - name: Build & Validate Extensions, Custom Types, and Hooks
      run: |
        pgxtool
        pgxtool init
        pgxtool available-hooks
        pgxtool create-project test
        pgxtool create-hook emit_log
        pgxtool create-type factorial --base-type int
        pgxtool create-type geo_coord --base-type float64
        pgxtool create-type nickname --base-type string
        pgxtool create-type is_active --base-type bool
        pgxtool build-extension emit_log
        pgxtool build-extension factorial
        pgxtool build-extension geo_coord
        pgxtool build-extension nickname
        pgxtool build-extension is_active

    - name: Run PostgreSQL Container Regression Tests
      run: |
        pgxtool test factorial --pg 16
        pgxtool test geo_coord --pg 16
        pgxtool test nickname --pg 16
        pgxtool test is_active --pg 16

