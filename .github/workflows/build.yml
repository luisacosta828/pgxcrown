name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host-lint-and-cli:
    name: Host CLI & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"

      - name: Install pgxtool from workspace
        run: nimble -y install

      - name: Verify pgxtool version matches pgxcrown.nimble
        run: |
          EXPECTED_VER="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pgxcrown.nimble | head -n1)"
          ACTUAL_VER="$(pgxtool --version)"
          echo "Expected: pgxtool v${EXPECTED_VER} | Actual: ${ACTUAL_VER}"
          [ "${ACTUAL_VER}" = "pgxtool v${EXPECTED_VER}" ]

      - name: Validate docs JS, test_matrix.sh, and GitHub workflow YAML
        run: |
          node --check docs/script.js
          bash -n scripts/test_matrix.sh
          if python3 -c "import yaml" 2>/dev/null; then
            python3 - <<'PY'
          import glob, yaml
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              with open(path, "r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print("YAML_OK:", path)
          PY
          else
            ruby -ryaml -e 'Dir[".github/workflows/*.yml"].sort.each { |f| YAML.load_file(f); puts "YAML_OK: #{f}" }'
          fi

  pg-matrix:
    name: Test Matrix (PostgreSQL ${{ matrix.pg_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["14", "15", "16", "17", "18"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"

      - name: Install host pgxtool from workspace
        run: nimble -y install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pgxcrown:${{ matrix.pg_version }} image from workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pgxcrown:${{ matrix.pg_version }}
          build-args: |
            PG_TAG=${{ matrix.pg_version }}
            NIM_VERSION=2.4.0
            PGXCROWN_SOURCE=local
          cache-from: type=gha,scope=pgxcrown-pg-${{ matrix.pg_version }}

      - name: Run Unit Tests, Negative Security Blocks & Hook Build (in PG ${{ matrix.pg_version }} container)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" "pgxcrown:${{ matrix.pg_version }}" bash -lc '
            set -euo pipefail
            EXPECTED_VER="$(sed -n -E "s/^version[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\1/p" /repo/pgxcrown.nimble | head -n1)"
            [ "$(pgxtool --version)" = "pgxtool v${EXPECTED_VER}" ]

            mkdir -p /tmp/repo_check
            cp /repo/pgxcrown.nimble /tmp/repo_check/pgxcrown.nimble
            cp -r /repo/src /tmp/repo_check/src
            cp -r /repo/tests /tmp/repo_check/tests
            cd /tmp/repo_check

            shopt -s nullglob
            mapfile -t unit_tests < <(printf "%s\n" tests/test_*.nim | LC_ALL=C sort)
            if [ "${#unit_tests[@]}" -eq 0 ]; then
              echo "❌ No unit test files found matching tests/test_*.nim"
              exit 1
            fi

            for t in "${unit_tests[@]}"; do
              echo "==> Running unit suite (debug): $t"
              nim c -r --hints:off --path:src "$t"
              echo "==> Running unit suite (release+ARC): $t"
              nim c -r -d:release --mm:arc --hints:off --path:src "$t"
            done

            chmod +x tests/negative/verify_security_blocks.sh
            ./tests/negative/verify_security_blocks.sh

            TMP_HOOK_HOME="$(mktemp -d)"
            export PGXTOOL_HOME="$TMP_HOOK_HOME"
            pgxtool init >/dev/null
            for hk in emit_log post_parse_analyze executor process_utility; do
              pgxtool create-hook "$hk"
              pgxtool build-extension "$hk"
            done
            rm -rf "$TMP_HOOK_HOME"

            TMP_LSP_HOME="$(mktemp -d)"
            export PGXTOOL_HOME="$TMP_LSP_HOME"
            pgxtool init >/dev/null
            pgxtool create-project lsp_smoke
            (cd "$TMP_LSP_HOME/lsp_smoke" && nim check src/main.nim)
            rm -rf "$TMP_LSP_HOME"

            TMP_VERIFY_HOME="$(mktemp -d)"
            export PGXTOOL_HOME="$TMP_VERIFY_HOME"
            export PGX_INTEGRITY_KEY="ci-verify-smoke-key"
            pgxtool init >/dev/null
            pgxtool create-project verify_smoke
            pgxtool build-extension verify_smoke
            pgxtool verify verify_smoke --require-signature
            "$TMP_VERIFY_HOME/verify_smoke/src/install.sh" >/dev/null
            pgxtool verify verify_smoke --installed --require-signature
            if PGX_INTEGRITY_KEY="wrong-verify-key" pgxtool verify verify_smoke --require-signature >/dev/null 2>&1; then
              echo "❌ Expected pgxtool verify to reject mismatched PGX_INTEGRITY_KEY!"
              exit 1
            fi

            pgxtool build-extension /tmp/repo_check/tests/v32_v33_interop_suite --force
            pgxtool verify /tmp/repo_check/tests/v32_v33_interop_suite --require-signature
            /tmp/repo_check/tests/v32_v33_interop_suite/src/install.sh >/dev/null
            pgxtool verify v32_v33_interop_suite --installed --require-signature
            unset PGX_INTEGRITY_KEY
            rm -rf "$TMP_VERIFY_HOME"
          '

      - name: Run All 20 E2E Regression Suites (PG ${{ matrix.pg_version }})
        run: |
          for suite in \
            arch_v30_suite \
            arrays_suite \
            defaults_and_nulls \
            guc_security_suite \
            hooks_composable_suite \
            integrity_suite \
            ipc_dsm_suite \
            json_suite \
            null_defense_suite \
            panic_shield \
            pg_ast_lens \
            pgtry_guard \
            plugin_extensibility_suite \
            security_suite \
            shmem_preload_suite \
            spi_binary_suite \
            srf_suite \
            types_v29_suite \
            v32_v33_interop_suite \
            xact_callbacks_suite
          do
            echo "==> Running E2E suite: tests/$suite (PG ${{ matrix.pg_version }})"
            pgxtool test "tests/$suite" --pg "${{ matrix.pg_version }}"
          done

      - name: Run CLI Scaffolding & LSP Smoke Tests (PG ${{ matrix.pg_version }})
        run: |
          TMP_HOME="$(mktemp -d)"
          trap 'rm -rf "$TMP_HOME"' EXIT
          export PGXTOOL_HOME="$TMP_HOME"
          cd "$TMP_HOME"
          pgxtool init
          pgxtool available-hooks
          pgxtool list-templates
          pgxtool verify --help >/dev/null
          if pgxtool verify nonexistent_smoke_ext >/dev/null 2>&1; then
            echo "❌ Expected pgxtool verify on nonexistent project to fail!"
            exit 1
          fi
          pgxtool create-project sample_ext
          pgxtool create-type factorial --base-type int
          pgxtool create-type geo_coord --base-type float64
          pgxtool create-type nickname --base-type string
          pgxtool create-type is_active --base-type bool
          pgxtool create-type grade_code --base-type char
          pgxtool create-type big_counter --base-type uint64
          pgxtool create-worker order_archiver
          pgxtool create-hook emit_log
          pgxtool create-hook post_parse_analyze
          pgxtool create-hook executor
          pgxtool create-hook process_utility

          [ -f "$TMP_HOME/sample_ext/nim.cfg" ]
          pgxtool sync-lsp sample_ext --pg "${{ matrix.pg_version }}"

          for prj in sample_ext factorial geo_coord nickname is_active grade_code big_counter order_archiver emit_log post_parse_analyze executor process_utility; do
            pgxtool test "$prj" --pg "${{ matrix.pg_version }}" --bless
          done

          for tpl in starter-udf base-type bgworker-service hook-observability plugin-custom-type secure-service; do
            tpl_prj="tpl_${tpl//-/_}"
            pgxtool new "$tpl_prj" --template "$tpl"
            [ -f "$TMP_HOME/$tpl_prj/nim.cfg" ]
            pgxtool sync-lsp "$tpl_prj" --pg "${{ matrix.pg_version }}"
            pgxtool test "$tpl_prj" --pg "${{ matrix.pg_version }}"
          done
